name: ci-cd-aks

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  APP_NAME: testrepo

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.image.outputs.value }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Build and test
        run: mvn -B clean test package

      - name: Azure login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: ACR login
        run: az acr login --name "${{ secrets.ACR_NAME }}"

      - name: Build and push image
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          IMAGE="${{ secrets.ACR_LOGIN_SERVER }}/${APP_NAME}:${IMAGE_TAG}"
          docker build -t "$IMAGE" .
          docker push "$IMAGE"
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"

      - name: Set image output
        id: image
        run: echo "value=${IMAGE}" >> "$GITHUB_OUTPUT"

  deploy-dev:
    runs-on: ubuntu-latest
    needs: build-and-push
    environment: dev
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Azure login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Set AKS context (dev)
        uses: azure/aks-set-context@v4
        with:
          resource-group: ${{ secrets.AKS_RESOURCE_GROUP_DEV }}
          cluster-name: ${{ secrets.AKS_CLUSTER_NAME_DEV }}

      - name: Deploy to dev
        env:
          NAMESPACE: dev
          IMAGE: ${{ needs.build-and-push.outputs.image }}
        run: |
          kubectl create namespace "$NAMESPACE" --dry-run=client -o yaml | kubectl apply -f -
          kubectl apply -n "$NAMESPACE" -f k8s/
          kubectl set image deployment/${APP_NAME} ${APP_NAME}="$IMAGE" -n "$NAMESPACE"
          kubectl rollout status deployment/${APP_NAME} -n "$NAMESPACE" --timeout=180s

  deploy-test:
    runs-on: ubuntu-latest
    needs: deploy-dev
    environment: test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Azure login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Set AKS context (test)
        uses: azure/aks-set-context@v4
        with:
          resource-group: ${{ secrets.AKS_RESOURCE_GROUP_TEST }}
          cluster-name: ${{ secrets.AKS_CLUSTER_NAME_TEST }}

      - name: Deploy to test
        env:
          NAMESPACE: test
          IMAGE: ${{ needs.build-and-push.outputs.image }}
        run: |
          kubectl create namespace "$NAMESPACE" --dry-run=client -o yaml | kubectl apply -f -
          kubectl apply -n "$NAMESPACE" -f k8s/
          kubectl set image deployment/${APP_NAME} ${APP_NAME}="$IMAGE" -n "$NAMESPACE"
          kubectl rollout status deployment/${APP_NAME} -n "$NAMESPACE" --timeout=180s

  deploy-stage:
    runs-on: ubuntu-latest
    needs: deploy-test
    environment: stage
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Azure login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Set AKS context (stage)
        uses: azure/aks-set-context@v4
        with:
          resource-group: ${{ secrets.AKS_RESOURCE_GROUP_STAGE }}
          cluster-name: ${{ secrets.AKS_CLUSTER_NAME_STAGE }}

      - name: Deploy to stage
        env:
          NAMESPACE: stage
          IMAGE: ${{ needs.build-and-push.outputs.image }}
        run: |
          kubectl create namespace "$NAMESPACE" --dry-run=client -o yaml | kubectl apply -f -
          kubectl apply -n "$NAMESPACE" -f k8s/
          kubectl set image deployment/${APP_NAME} ${APP_NAME}="$IMAGE" -n "$NAMESPACE"
          kubectl rollout status deployment/${APP_NAME} -n "$NAMESPACE" --timeout=180s

  deploy-prod:
    runs-on: ubuntu-latest
    needs: deploy-stage
    environment: prod
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Azure login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Set AKS context (prod)
        uses: azure/aks-set-context@v4
        with:
          resource-group: ${{ secrets.AKS_RESOURCE_GROUP_PROD }}
          cluster-name: ${{ secrets.AKS_CLUSTER_NAME_PROD }}

      - name: Deploy to prod
        env:
          NAMESPACE: prod
          IMAGE: ${{ needs.build-and-push.outputs.image }}
        run: |
          kubectl create namespace "$NAMESPACE" --dry-run=client -o yaml | kubectl apply -f -
          kubectl apply -n "$NAMESPACE" -f k8s/
          kubectl set image deployment/${APP_NAME} ${APP_NAME}="$IMAGE" -n "$NAMESPACE"
          kubectl rollout status deployment/${APP_NAME} -n "$NAMESPACE" --timeout=180s
