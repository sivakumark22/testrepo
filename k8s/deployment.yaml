apiVersion: apps/v1
kind: Deployment
metadata:
  name: testrepo
  labels:
    app: testrepo
spec:
  replicas: 2
  selector:
    matchLabels:
      app: testrepo
  template:
    metadata:
      labels:
        app: testrepo
    spec:
      containers:
        - name: testrepo
          image: nginx:stable
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 20
